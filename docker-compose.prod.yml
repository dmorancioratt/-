services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PATH: /app/data/shurong_zhilian.db
    expose:
      - "8000"
    volumes:
      - ./backend/shurong_zhilian.db:/app/data/shurong_zhilian.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "18080:80"
    depends_on:
      - backend
